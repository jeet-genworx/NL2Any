nullable = true

[tables."finopsiq.thread_enrichment_queue".columns.created_at]
type = "timestamp with time zone"
description = "Timestamp when the enrichment queue entry was created"
nullable = false

[tables."finopsiq.thread_enrichment_queue".columns.updated_at]
type = "timestamp with time zone"
description = "Timestamp when the enrichment queue entry was last updated"
nullable = false

