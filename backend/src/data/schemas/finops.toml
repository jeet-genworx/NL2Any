description = "The finopsiq.customers table stores the canonical customer records and their identifying, contact, organizational, and address information. Each customer is uniquely identified by customer_id. The customers table is related to invoices through invoices.customer_id = customers.customer_id. Therefore, when a query asks for customers associated with invoices, use the invoices.customer_id relationship. When a query asks for customers associated with discrepancy details, the relationship must be traversed through the invoice and GenBooks request records: discrepancies_details.match_id = genbooks_requests.match_id, genbooks_requests.invoice_id = invoices.invoice_id, and invoices.customer_id = customers.customer_id. IMPORTANT: customers.customer_id must not be joined directly to discrepancies_details.match_id or genbooks_requests.match_id because these identifiers represent different entities. The table contains customer names, company information, contact information, tax information, account status, and billing/shipping addresses."

[tables."finopsiq.customers".columns.customer_id]
type = "uuid"
description = "Unique identifier for the customer. This is the canonical customer identifier and corresponds to invoices.customer_id."
nullable = false

[tables."finopsiq.customers".columns.tenant_id]
type = "uuid"
description = "Identifier of the tenant or organization to which the customer belongs."
nullable = false

