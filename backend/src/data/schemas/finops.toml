[tables."finopsiq.discrepancies_details"]
kind = "table"
description = "The finopsiq.discrepancies_details table stores the detailed results of document matching and discrepancy detection. Each record represents a discrepancy result associated with a matching process and contains the match_id identifying that matching process. IMPORTANT: discrepancies_details.match_id identifies a match/process and is NOT an invoice identifier. It must NOT be directly joined to invoices.invoice_id. To find the invoice associated with a discrepancy, use genbooks_requests as the relationship bridge: discrepancies_details.match_id = genbooks_requests.match_id, then genbooks_requests.invoice_id = invoices.invoice_id. Once the invoice is identified, invoices.customer_id can be used to connect the invoice to customers.customer_id. This relationship path should be used whenever a query asks for discrepancy details together with invoice or customer information. The table contains the discrepancy status, confidence information, comparison results, missing-document information, matched details, processing metadata, and other information required to understand the detected discrepancy."

[tables."finopsiq.discrepancies_details".columns.discrepancies_id]
type = "uuid"
description = "Unique identifier for the discrepancy record. Identifies the discrepancy itself and is distinct from match_id and invoice_id."
nullable = false

[tables."finopsiq.discrepancies_details".columns.tenant_id]
type = "uuid"
description = "Identifier of the tenant or organization associated with the discrepancy. Used to maintain tenant-level data isolation."
nullable = false

[tables."finopsiq.discrepancies_details".columns.match_id]
type = "uuid"
description = "Identifier of the matching process associated with this discrepancy. This value corresponds to genbooks_requests.match_id and should be joined to genbooks_requests.match_id when tracing the discrepancy to its originating request or invoice. IMPORTANT: this is a match/process identifier, NOT an invoice_id. Do NOT join discrepancies_details.match_id directly to invoices.invoice_id."
nullable = false

[tables."finopsiq.discrepancies_details".columns.match_type]
type = "character varying"
description = "Type or category of matching process that produced the discrepancy."
nullable = false

[tables."finopsiq.discrepancies_details".columns.has_discrepancy]
type = "boolean"
description = "Flag indicating whether a discrepancy was detected for the associated matching process."
nullable = false

[tables."finopsiq.discrepancies_details".columns.confidence_score]
type = "numeric"
description = "Overall confidence score produced for the discrepancy or matching result."
nullable = false

[tables."finopsiq.discrepancies_details".columns.confidence_breakdown]
type = "jsonb"
description = "Detailed breakdown explaining the components contributing to the confidence score."
nullable = false

[tables."finopsiq.discrepancies_details".columns.comparison_discrepancies_details]
type = "jsonb"
description = "Detailed information describing the differences identified during document or record comparison."
nullable = false

[tables."finopsiq.discrepancies_details".columns.basic_validation_details]
type = "jsonb"
description = "Results and details from basic validation checks performed during discrepancy detection."
nullable = false

[tables."finopsiq.discrepancies_details".columns.missing_relevant_documents]
type = "boolean"
description = "Flag indicating whether relevant documents required for the matching process are missing."
nullable = false

[tables."finopsiq.discrepancies_details".columns.missing_relevant_documents_info]
type = "jsonb"
description = "Detailed information about documents that were expected but were missing during processing."
nullable = true

[tables."finopsiq.discrepancies_details".columns.matched_details]
type = "jsonb"
description = "Details describing the records, documents, or fields that were successfully matched during the matching process."
nullable = false

[tables."finopsiq.discrepancies_details".columns.discrepancy_summary]
type = "jsonb"
description = "Summary of the discrepancy findings generated by the matching or validation process."
nullable = false

[tables."finopsiq.discrepancies_details".columns.processing_metadata]
type = "jsonb"
description = "Metadata describing how the discrepancy record was processed, including processing-related information."
nullable = false

[tables."finopsiq.discrepancies_details".columns.enriched_findings]
type = "jsonb"
description = "Additional findings or information added during enrichment of the discrepancy result."
nullable = true

[tables."finopsiq.discrepancies_details".columns.pre_revalidation_details]
type = "jsonb"
description = "Details generated before or during the pre-revalidation stage of discrepancy processing."
nullable = true

[tables."finopsiq.discrepancies_details".columns.created_by_user_id]
type = "uuid"
description = "Identifier of the user who created the discrepancy record."
nullable = true

[tables."finopsiq.discrepancies_details".columns.resolved_by_user_id]
type = "uuid"
description = "Identifier of the user who resolved the discrepancy, if it has been resolved."
nullable = true

[tables."finopsiq.discrepancies_details".columns.created_at]
type = "timestamp with time zone"
description = "Timestamp when the discrepancy record was created."
nullable = false

[tables."finopsiq.discrepancies_details".columns.updated_at]
type = "timestamp with time zone"
description = "Timestamp when the discrepancy record was last updated."
nullable = false

[tables."finopsiq.discrepancies_details".columns.dra_trigger_status]
type = "character varying"
description = "Status indicating whether the DRA process was triggered for this discrepancy."
nullable = false

[tables."finopsiq.discrepancies_details".columns.dra_claimed_at]
type = "timestamp with time zone"
description = "Timestamp when the discrepancy was claimed by the DRA process."
nullable = true

[tables."finopsiq.discrepancies_details".columns.dra_completed_at]
type = "timestamp with time zone"
description = "Timestamp when DRA processing for the discrepancy was completed."
nullable = true

[tables."finopsiq.discrepancies_details".columns.dra_attempts]
type = "integer"
description = "Number of attempts made by the DRA process to handle the discrepancy."
