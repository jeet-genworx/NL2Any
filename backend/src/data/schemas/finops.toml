description = "The thread enrichment queue tracks the status and details of threads that need enrichment. It includes information such as the tenant ID, conversation ID, status, time when the thread was claimed, the number of retries, any errors encountered, and timestamps for creation and update. This table is used to manage and monitor the processing of threads for enrichment tasks."

[tables."finopsiq.thread_enrichment_queue".columns.id]
type = "uuid"
description = "Unique identifier for the enrichment queue entry"
nullable = false

[tables."finopsiq.thread_enrichment_queue".columns.tenant_id]
type = "uuid"
description = "Identifier of the tenant associated with the queue entry"
nullable = false

[tables."finopsiq.thread_enrichment_queue".columns.conversation_id]
type = "character varying"
description = "ID of the conversation being enriched"
nullable = false

[tables."finopsiq.thread_enrichment_queue".columns.status]
type = "character varying"
description = "Current status of the enrichment process"
nullable = false

[tables."finopsiq.thread_enrichment_queue".columns.claimed_at]
type = "timestamp with time zone"
description = "Timestamp when the thread was claimed for processing"
nullable = true

[tables."finopsiq.thread_enrichment_queue".columns.retry_count]
