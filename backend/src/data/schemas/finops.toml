type = "text"
description = "Error message generated during processing of the request, if any."
nullable = true

[tables."finopsiq.genbooks_requests".columns.invoice_type]
type = "character varying"
description = "Type or classification of the invoice associated with the request."
nullable = true

[tables."finopsiq.genbooks_requests".columns.ar_status]
type = "character varying"
description = "Accounts receivable status associated with the request or invoice."
nullable = true

[tables."finopsiq.genbooks_requests".columns.status_reason]
type = "text"
description = "Explanation or reason associated with the current processing status."
nullable = true

[tables."finopsiq.genbooks_requests".columns.is_deleted]
type = "boolean"
