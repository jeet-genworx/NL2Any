[tables."finopsiq.genbooks_requests"]
kind = "table"
description = "The finopsiq.genbooks_requests table stores and tracks GenBooks document-processing requests and is a critical relationship table between discrepancy matching records and the original invoices. Each request can contain both a match_id and an invoice_id, allowing a discrepancy match to be traced back to the invoice that was processed. The match_id in this table represents the matching/process identifier and is NOT the same identifier as invoices.invoice_id. When connecting discrepancies_details to invoices, use genbooks_requests as the bridge: discrepancies_details.match_id joins to genbooks_requests.match_id, and genbooks_requests.invoice_id then joins to invoices.invoice_id. Do NOT directly join discrepancies_details.match_id to invoices.invoice_id because these identifiers represent different entities. The invoice associated with a request can then be connected to its customer through invoices.customer_id. This table is therefore the authoritative relationship path for tracing a discrepancy match to its original invoice."

[tables."finopsiq.genbooks_requests".columns.request_id]
type = "uuid"
description = "Unique identifier for the GenBooks processing request. Identifies the request record itself and is not an invoice ID or match ID."
nullable = false

[tables."finopsiq.genbooks_requests".columns.invoice_id]
type = "uuid"
description = "Identifier of the invoice associated with this processing request. This value corresponds to invoices.invoice_id and can be used to join this table to the invoices table. It is NOT the same as match_id."
nullable = false

[tables."finopsiq.genbooks_requests".columns.tenant_id]
type = "uuid"
description = "Identifier of the tenant or organization that owns the processing request. Used to maintain tenant-level data isolation."
nullable = false

[tables."finopsiq.genbooks_requests".columns.file_urls]
type = "jsonb"
description = "URLs of files associated with the GenBooks processing request."
nullable = true

[tables."finopsiq.genbooks_requests".columns.status]
type = "character varying"
description = "Current processing status of the GenBooks request."
nullable = false

[tables."finopsiq.genbooks_requests".columns.match_id]
type = "uuid"
description = "Identifier of the matching process or match associated with this request. This value corresponds to discrepancies_details.match_id and is used to connect a discrepancy to its processing request. It is NOT the same as invoices.invoice_id and must not be directly joined to invoices.invoice_id."
nullable = true

[tables."finopsiq.genbooks_requests".columns.discrepancies_id]
type = "uuid"
description = "Identifier of the discrepancy associated with this processing request. References the discrepancy record represented by discrepancies_details.discrepancies_id when such a relationship exists."
nullable = true

