[tables."finopsiq.invoices"]
description = "The finopsiq.invoices table stores the canonical invoice records and detailed invoice information. Each invoice is uniquely identified by invoice_id. An invoice can be associated with a customer through customer_id, where invoices.customer_id corresponds to customers.customer_id. IMPORTANT: invoices.invoice_id represents the invoice identifier and must not be assumed to be the same as a discrepancy match_id. There is no direct relationship between discrepancies_details.match_id and invoices.invoice_id. When an invoice needs to be retrieved from a discrepancy, first use genbooks_requests to resolve the relationship: discrepancies_details.match_id = genbooks_requests.match_id, then genbooks_requests.invoice_id = invoices.invoice_id. After reaching the invoice, invoices.customer_id can be used to retrieve the associated customer. This table contains invoice identity, vendor and customer references, invoice dates, statuses, amounts, tax information, addresses, source information, and other invoice-related metadata."

