[tables."finopsiq.invoices"]
description = "Central table for vendor bills (AP payables) and customer invoices (AR receivables). Contains invoice numbers, amounts, subtotal, balance due, processing status ('pending', 'needs_review', 'ready_to_pay', 'paid', 'rejected', 'overdue', 'partially_paid', 'void'), invoice types ('AP', 'AR'), issue dates, due dates, currencies, and USD conversions (amount_usd). Links to suppliers via invoices.vendor_id = vendors.vendor_id (where vendors include major cloud and SaaS providers like AWS, Azure, GCP, Snowflake, Datadog, OpenAI). Parent purchase orders are linked via invoices.purchase_order_number = purchase_orders.po_number; when querying an invoice with its parent purchase order, always join on invoices.purchase_order_number = purchase_orders.po_number (do NOT join on purchase_orders.invoice_id, as invoice_id is an optional secondary reverse pointer). Line items link via invoices.invoice_id = invoice_line_items.invoice_id; when checking conditions on individual line items (such as rate inflation or unit price increases against contracted PO lines), correlate with invoice_line_items joined to po_line_items on po_line_item_id, or use an EXISTS subquery on invoice_line_items correlated with invoices.invoice_id. Use for questions about spend, unpaid bills, overdue amounts, PO spend compliance, and payment tracking."

[tables."finopsiq.invoices".columns]
invoice_id = "Unique invoice UUID. Primary key referenced across line items, payments, discrepancies, and reminders."
tenant_id = "Tenant UUID owning this invoice."
purchase_order_number = "Canonical parent purchase order number reference. Joins to finopsiq.purchase_orders.po_number (invoices.purchase_order_number = purchase_orders.po_number) to link an invoice to its parent purchase order."
original_file_name = "Original uploaded invoice file name."
contract_number = "Referenced contract or MSA number."
vendor_id = "FK to finopsiq.vendors.vendor_id (supplier)."
customer_id = "FK to finopsiq.customers.customer_id (cost center / internal department)."
connector_id = "Connector ID if synced from ERP."
external_invoice_id = "Invoice ID in external ERP."
external_realm_id = "External ERP realm/company ID."
source = "Origin source: 'email', 'sync', 'upload'."
