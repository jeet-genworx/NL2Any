[tables."finopsiq.discrepancies_details"]
description = "The finopsiq.discrepancies_details table stores the detailed results of document matching and discrepancy detection. Each record represents a discrepancy result associated with a matching process and contains the match_id identifying that matching process. IMPORTANT: discrepancies_details.match_id identifies a match/process and is NOT an invoice identifier. It must NOT be directly joined to invoices.invoice_id. To find the invoice associated with a discrepancy, use genbooks_requests as the relationship bridge: discrepancies_details.match_id = genbooks_requests.match_id, then genbooks_requests.invoice_id = invoices.invoice_id. Once the invoice is identified, invoices.customer_id can be used to connect the invoice to customers.customer_id. This relationship path should be used whenever a query asks for discrepancy details together with invoice or customer information. The table contains the discrepancy status, confidence information, comparison results, missing-document information, matched details, processing metadata, and other information required to understand the detected discrepancy."

[tables."finopsiq.discrepancies_details".columns]
discrepancies_id = "Unique identifier for the discrepancy record. Identifies the discrepancy itself and is distinct from match_id and invoice_id."
tenant_id = "Identifier of the tenant or organization associated with the discrepancy. Used to maintain tenant-level data isolation."
match_id = "Identifier of the matching process associated with this discrepancy. This value corresponds to genbooks_requests.match_id and should be joined to genbooks_requests.match_id when tracing the discrepancy to its originating request or invoice. IMPORTANT: this is a match/process identifier, NOT an invoice_id. Do NOT join discrepancies_details.match_id directly to invoices.invoice_id."
match_type = "Type or category of matching process that produced the discrepancy."
has_discrepancy = "Flag indicating whether a discrepancy was detected for the associated matching process."
confidence_score = "Overall confidence score produced for the discrepancy or matching result."
confidence_breakdown = "Detailed breakdown explaining the components contributing to the confidence score."
comparison_discrepancies_details = "Detailed information describing the differences identified during document or record comparison."
basic_validation_details = "Results and details from basic validation checks performed during discrepancy detection."
missing_relevant_documents = "Flag indicating whether relevant documents required for the matching process are missing."
missing_relevant_documents_info = "Detailed information about documents that were expected but were missing during processing."
matched_details = "Details describing the records, documents, or fields that were successfully matched during the matching process."
discrepancy_summary = "Summary of the discrepancy findings generated by the matching or validation process."
processing_metadata = "Metadata describing how the discrepancy record was processed, including processing-related information."
enriched_findings = "Additional findings or information added during enrichment of the discrepancy result."
pre_revalidation_details = "Details generated before or during the pre-revalidation stage of discrepancy processing."
created_by_user_id = "Identifier of the user who created the discrepancy record."
resolved_by_user_id = "Identifier of the user who resolved the discrepancy, if it has been resolved."
created_at = "Timestamp when the discrepancy record was created."
updated_at = "Timestamp when the discrepancy record was last updated."
dra_trigger_status = "Status indicating whether the DRA process was triggered for this discrepancy."
dra_claimed_at = "Timestamp when the discrepancy was claimed by the DRA process."
dra_completed_at = "Timestamp when DRA processing for the discrepancy was completed."
dra_attempts = "Number of attempts made by the DRA process to handle the discrepancy."

[tables."finopsiq.genbooks_requests"]
description = "The finopsiq.genbooks_requests table stores and tracks GenBooks document-processing requests and is a critical relationship table between discrepancy matching records and the original invoices. Each request can contain both a match_id and an invoice_id, allowing a discrepancy match to be traced back to the invoice that was processed. The match_id in this table represents the matching/process identifier and is NOT the same identifier as invoices.invoice_id. When connecting discrepancies_details to invoices, use genbooks_requests as the bridge: discrepancies_details.match_id joins to genbooks_requests.match_id, and genbooks_requests.invoice_id then joins to invoices.invoice_id. Do NOT directly join discrepancies_details.match_id to invoices.invoice_id because these identifiers represent different entities. The invoice associated with a request can then be connected to its customer through invoices.customer_id. This table is therefore the authoritative relationship path for tracing a discrepancy match to its original invoice."

[tables."finopsiq.genbooks_requests".columns]
request_id = "Unique identifier for the GenBooks processing request. Identifies the request record itself and is not an invoice ID or match ID."
invoice_id = "Identifier of the invoice associated with this processing request. This value corresponds to invoices.invoice_id and can be used to join this table to the invoices table. It is NOT the same as match_id."
tenant_id = "Identifier of the tenant or organization that owns the processing request. Used to maintain tenant-level data isolation."
file_urls = "URLs of files associated with the GenBooks processing request."
status = "Current processing status of the GenBooks request."
match_id = "Identifier of the matching process or match associated with this request. This value corresponds to discrepancies_details.match_id and is used to connect a discrepancy to its processing request. It is NOT the same as invoices.invoice_id and must not be directly joined to invoices.invoice_id."
discrepancies_id = "Identifier of the discrepancy associated with this processing request. References the discrepancy record represented by discrepancies_details.discrepancies_id when such a relationship exists."
channel = "Channel through which the processing request was received or created."
agent_updated = "Indicates whether an agent has updated the processing request."
error_message = "Error message generated during processing of the request, if any."
invoice_type = "Type or classification of the invoice associated with the request."
ar_status = "Accounts receivable status associated with the request or invoice."
status_reason = "Explanation or reason associated with the current processing status."
is_deleted = "Flag indicating whether the processing request has been logically deleted."
deleted_at = "Timestamp at which the processing request was logically deleted."
created_at = "Timestamp when the processing request was created."
updated_at = "Timestamp when the processing request was last updated."

