[tables."finopsiq.purchase_orders"]
description = "Purchase orders (POs) committed to vendors for cloud capacity, software licenses, hardware, and services. Links to vendor via purchase_orders.vendor_id = vendors.vendor_id and to internal cost centers via purchase_orders.customer_id = customers.customer_id. Invoices reference their parent purchase order via invoices.purchase_order_number = purchase_orders.po_number; to join a purchase order to associated invoices, always join on purchase_orders.po_number = invoices.purchase_order_number. IMPORTANT: Do NOT join on purchase_orders.invoice_id (which is an optional legacy reverse pointer); the canonical relationship is purchase_orders.po_number = invoices.purchase_order_number. Line items are stored in finopsiq.po_line_items linked by po_line_items.po_id = purchase_orders.po_id. Use for questions about approved commitments, PO total amounts, unbilled PO balances, PO status ('issued', 'approved', 'partially_billed', 'fully_billed', 'closed', 'cancelled'), delivery dates, and 3-way matching with invoices."

