[tables.support_tickets]
kind = "table"
description = "The support_tickets table tracks customer support requests. It contains ticket ID, customer ID, employee ID, subject, status, priority, and timestamps for creation and resolution. This table is connected to customers through customer_id and to employees through employee_id."

