[tables.customers]
kind = "table"
description = "The customers table stores information about all registered customers. It contains columns for customer ID, name, email, phone, city, and creation date. This table is used to look up customer details and is connected to orders and support tickets through customer_id foreign keys."

[tables.customers.columns.id]
type = "integer"
description = "Unique identifier for the customer"
nullable = false

[tables.customers.columns.name]
type = "character varying"
description = "Full name of the customer"
nullable = false

[tables.customers.columns.email]
type = "character varying"
description = "Email address of the customer"
nullable = false

[tables.customers.columns.phone]
type = "character varying"
description = "Phone number of the customer"
nullable = true

[tables.customers.columns.city]
type = "character varying"
description = "City where the customer is located"
nullable = true

[tables.customers.columns.created_at]
type = "timestamp with time zone"
description = "Timestamp when the customer was created"
nullable = false

[tables.employees]
kind = "table"
description = "The employees table stores information about all employees. It includes employee ID, name, email, department, role, city, and hire date. This table is connected to support_tickets through employee_id."

[tables.employees.columns.id]
type = "integer"
