nullable = true

[tables.products]
kind = "table"
description = "The products table stores information about available items in the inventory. It contains the unique identifier, name, category, price, stock quantity, and timestamp of when the product was created. This table is used to look up product details, manage inventory levels, and track when products were added to the system."

