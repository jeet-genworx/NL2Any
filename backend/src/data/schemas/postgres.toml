description = "Timestamp when the employee was hired"
nullable = false

[tables.order_items]
kind = "table"
description = "The order_items table lists the products included in each order. It contains item ID, order ID, product ID, quantity, and unit price. This table is connected to orders through order_id and to products through product_id (though products table is not in this batch)."

[tables.order_items.columns.id]
type = "integer"
description = "Unique identifier for the order item"
nullable = false

[tables.order_items.columns.order_id]
type = "integer"
description = "FK to orders"
nullable = false

[tables.order_items.columns.product_id]
type = "integer"
description = "FK to products"
nullable = false

[tables.order_items.columns.quantity]
type = "integer"
description = "Number of units purchased"
nullable = false

[tables.order_items.columns.unit_price]
type = "numeric"
description = "Price per unit of the product"
nullable = false

[tables.orders]
kind = "table"
description = "The orders table records all customer orders. It includes order ID, customer ID, order date, status, total amount, and shipping city. This table is connected to customers through customer_id and to order_items through order_id."

[tables.orders.columns.id]
type = "integer"
description = "Unique identifier for the order"
nullable = false

[tables.orders.columns.customer_id]
type = "integer"
