[tables.customers]
description = "Stores information about customers, including their personal details and when they were created. This table links to orders and support tickets via customer_id."

[tables.customers.columns]
id = "Primary key identifying the customer"
name = "Customer's full name"
email = "Customer's contact email"
phone = "Customer's phone number"
city = "Customer's city of residence"
created_at = "Timestamp when the customer was added"

[tables.orders]
description = "Records customer orders, including details like order date, status, total amount, and shipping city. This table links to customers and order items via foreign keys."

[tables.orders.columns]
id = "Primary key identifying the order"
customer_id = "FK to customers"
order_date = "Timestamp when the order was placed"
status = "Current status of the order"
total_amount = "Total cost of the order"
shipping_city = "City for order delivery"

[tables.support_tickets]
description = "Tracks support tickets for customers, including subject, status, priority, and timestamps. This table links to customers and employees via foreign keys."

[tables.support_tickets.columns]
id = "Primary key identifying the ticket"
customer_id = "FK to customers"
employee_id = "FK to employees"
subject = "Summary of the support request"
status = "Current status of the ticket"
priority = "Urgency level of the ticket"
created_at = "Timestamp when the ticket was opened"
resolved_at = "Timestamp when the ticket was closed"

[tables.order_items]
description = "Records items in orders, including product details, quantity, and unit price. This table links to orders and products via foreign keys."

[tables.order_items.columns]
id = "Primary key identifying the item"
order_id = "FK to orders"
product_id = "FK to products"
quantity = "Number of items ordered"
unit_price = "Price per item"

[tables.employees]
description = "Stores information about employees, including their name, department, role, and hire date. This table links to support tickets via foreign keys."

[tables.employees.columns]
id = "Primary key identifying the employee"
name = "Employee's full name"
email = "Employee's contact email"
department = "Employee's department"
role = "Employee's job title"
city = "Employee's city of residence"
hire_date = "Timestamp when the employee started"

[tables.products]
description = "This table stores detailed information about products, including their unique identifier, name, category, price, stock quantity, and creation timestamp. It is used to look up product details for inventory management, pricing, and historical records."

[tables.products.columns]
id = "Primary key identifier for the product"
name = "Name of the product"
category = "Product category"
price = "Product price"
stock_quantity = "Quantity of product in stock"
created_at = "Timestamp when the product was created"
