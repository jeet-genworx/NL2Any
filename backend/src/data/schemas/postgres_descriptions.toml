[database]
type = "postgresql"
name = "nl2anyquery_db"
generated_at = "2026-09-30T06:15:01.039872+00:00"

[tables.customers]
description = "The customers table stores information about all registered customers. It contains columns for customer ID, name, email, phone, city, and creation date. This table is used to look up customer details and is connected to orders and support tickets through customer_id foreign keys."

[tables.customers.columns]
id = "Unique identifier for the customer"
name = "Full name of the customer"
email = "Email address of the customer"
phone = "Phone number of the customer"
city = "City where the customer is located"
created_at = "Timestamp when the customer was created"

[tables.orders]
description = "The orders table records all customer orders. It includes order ID, customer ID, order date, status, total amount, and shipping city. This table is connected to customers through customer_id and to order_items through order_id."

[tables.orders.columns]
id = "Unique identifier for the order"
customer_id = "FK to customers"
order_date = "Timestamp when the order was placed"
status = "Current status of the order"
total_amount = "Total monetary value of the order"
shipping_city = "City where the order is shipped to"

[tables.support_tickets]
description = "The support_tickets table tracks customer support requests. It contains ticket ID, customer ID, employee ID, subject, status, priority, and timestamps for creation and resolution. This table is connected to customers through customer_id and to employees through employee_id."

[tables.support_tickets.columns]
id = "Unique identifier for the support ticket"
customer_id = "FK to customers"
employee_id = "FK to employees"
subject = "Summary of the support request"
status = "Current status of the ticket"
priority = "Level of urgency for the ticket"
created_at = "Timestamp when the ticket was created"
resolved_at = "Timestamp when the ticket was resolved"

[tables.order_items]
description = "The order_items table lists the products included in each order. It contains item ID, order ID, product ID, quantity, and unit price. This table is connected to orders through order_id and to products through product_id (though products table is not in this batch)."

[tables.order_items.columns]
id = "Unique identifier for the order item"
order_id = "FK to orders"
product_id = "FK to products"
quantity = "Number of units purchased"
unit_price = "Price per unit of the product"

[tables.employees]
description = "The employees table stores information about all employees. It includes employee ID, name, email, department, role, city, and hire date. This table is connected to support_tickets through employee_id."

[tables.employees.columns]
id = "Unique identifier for the employee"
name = "Full name of the employee"
email = "Email address of the employee"
department = "Department the employee belongs to"
role = "Job title or role of the employee"
city = "City where the employee is located"
hire_date = "Timestamp when the employee was hired"

[tables.products]
description = "The products table stores information about available items in the inventory. It contains the unique identifier, name, category, price, stock quantity, and timestamp of when the product was created. This table is used to look up product details, manage inventory levels, and track when products were added to the system."

[tables.products.columns]
id = "Unique identifier for the product"
name = "Name of the product"
category = "Product category"
price = "Price of the product"
stock_quantity = "Current stock level of the product"
created_at = "Timestamp when the product was added to the system"
