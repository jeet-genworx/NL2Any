[tables.customers]
description = "This table stores customer information, including their personal details and creation timestamp. It is linked to orders and support tickets via customer_id, representing the entity that initiates and is associated with these interactions."

[tables.customers.columns]
id = "Primary key identifier"
name = "Customer's full name"
email = "Customer's contact email"
phone = "Customer's phone number"
city = "Customer's location city"
created_at = "Timestamp when the customer was created"

[tables.orders]
description = "This table tracks customer orders, linking to the customers table via customer_id. It records order details such as date, status, total amount, and shipping city, representing transactions initiated by customers."

[tables.orders.columns]
id = "Primary key identifier"
customer_id = "FK to customers"
order_date = "Timestamp when the order was placed"
status = "Current status of the order"
total_amount = "Total monetary value of the order"
shipping_city = "City where the order is shipped"

[tables.support_tickets]
description = "This table tracks customer support tickets, linking to customers and employees via customer_id and employee_id. It records ticket details such as subject, priority, and timestamps for creation and resolution, representing support interactions."

[tables.support_tickets.columns]
id = "Primary key identifier"
customer_id = "FK to customers"
employee_id = "FK to employees"
subject = "Summary of the support request"
status = "Current status of the ticket"
priority = "Severity level of the issue"
created_at = "Timestamp when the ticket was created"
resolved_at = "Timestamp when the ticket was resolved"

[tables.order_items]
description = "This table tracks individual items within orders, linking to the orders table via order_id. It records product details such as quantity and unit price, representing the components of a transaction."

[tables.order_items.columns]
id = "Primary key identifier"
order_id = "FK to orders"
product_id = "Identifier for the product"
quantity = "Number of units purchased"
unit_price = "Price per unit of the product"

[tables.employees]
description = "This table stores employee information, including their name, contact details, department, role, and hire date. It is linked to support tickets via employee_id, representing the personnel managing customer interactions."

[tables.employees.columns]
id = "Primary key identifier"
name = "Employee's full name"
email = "Employee's contact email"
department = "Employee's work department"
role = "Employee's job title"
city = "Employee's location city"
hire_date = "Timestamp when the employee was hired"

[tables.products]
description = "This table stores information about products, including their unique identifiers, names, categories, prices, stock levels, and creation timestamps. It is used to look up product details and track inventory changes over time."

[tables.products.columns]
id = "Unique identifier for the product"
name = "Name of the product"
category = "Product category"
price = "Product price"
stock_quantity = "Quantity in stock"
created_at = "Timestamp when the product was created"
