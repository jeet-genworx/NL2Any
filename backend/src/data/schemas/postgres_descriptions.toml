[database]
type = "postgresql"
name = "nl2anyquery_db"
generated_at = "2026-10-13T09:02:47.934869+00:00"

[tables.customers]
description = "The customers table lists all customer records with their unique id, name, email, phone number, city, and creation timestamp. It is used to look up customer details such as contact information and location, and connects to orders and support tickets via customer_id."

[tables.customers.columns]
id = "customer unique identifier"
name = "customer full name"
email = "customer email address"
phone = "customer phone number"
city = "customer city of residence"
created_at = "when customer was created"

[tables.orders]
description = "The orders table tracks each order placed by a customer, including the order id, customer id, order date, status, total amount, and shipping city. It is used to find order history, financial details, and shipping information, and links to customers via customer_id and to order_items via order_id."

[tables.orders.columns]
id = "order unique identifier"
customer_id = "FK to customers"
order_date = "when order was placed"
status = "current order status"
total_amount = "total cost of order"
shipping_city = "city where order is shipped to"

[tables.support_tickets]
description = "The support_tickets table records each customer support request with a unique id, customer id, employee id, subject, status, priority, creation timestamp, and resolution timestamp. It is used to track support cases, identify open issues, and see resolution times, linking to customers and employees via customer_id and employee_id."

[tables.support_tickets.columns]
id = "ticket unique identifier"
customer_id = "FK to customers"
employee_id = "FK to employees"
subject = "summary of ticket issue"
status = "current ticket status"
priority = "ticket priority level"
created_at = "when ticket was opened"
resolved_at = "when ticket was closed"

[tables.order_items]
description = "The order_items table details each product in an order, including the item id, order id, product id, quantity, and unit price. It is used to find what products were ordered, how many, and at what price, linking to orders via order_id and to products via product_id."

[tables.order_items.columns]
id = "item unique identifier"
order_id = "FK to orders"
product_id = "FK to products"
quantity = "number of items ordered"
unit_price = "price per item"

[tables.employees]
description = "The employees table contains information about all employees, including their unique id, name, email, department, role, city, and hire date. It is used to identify staff members, their departments, roles, and hiring history, and connects to support_tickets via employee_id."

[tables.employees.columns]
id = "employee unique identifier"
name = "employee full name"
email = "employee email address"
department = "employee department"
role = "employee job title"
city = "employee city of residence"
hire_date = "when employee was hired"

[tables.products]
description = "The products table lists all available items in the inventory. It includes the product id, name, category, price, stock quantity, and creation timestamp. This table is used to look up product details such as pricing, availability, and category for sales, inventory management, and order fulfillment."

[tables.products.columns]
id = "unique product identifier"
name = "product name"
category = "product category"
price = "product price in currency"
stock_quantity = "current stock level"
created_at = "when product was created"
