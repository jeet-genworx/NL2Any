[project]
name = "nl2anyquery"
version = "0.1.0"
description = "Natural Language to Database Query POC - Foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "spacy>=3.7.0",
    "psycopg[binary]>=3.2.0",
    "pymongo>=4.8.0",
    "httpx>=0.27.0",
    "sqlglot>=25.0.0",
    "tomli-w>=1.0.0",
    "pandas>=2.2.0",
    "streamlit>=1.39.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
seed-postgres = "query_processing.cli:seed_postgres_cli"
seed-mongo = "query_processing.cli:seed_mongo_cli"
init-schema = "query_processing.cli:init_schema_cli"
describe-schema = "query_processing.cli:describe_schema_cli"
embed-schema = "query_processing.cli:embed_schema_cli"
ingest-schema = "query_processing.cli:ingest_schema_cli"
test-model = "query_processing.cli:test_model_cli"
test-retrieval = "query_processing.cli:test_retrieval_cli"
test-nlp = "query_processing.cli:test_nlp_cli"
run-api = "query_processing.cli:run_api_cli"
run-ui = "query_processing.cli:run_ui_cli"
generate-test-embeddings = "query_processing.cli:generate_test_embeddings_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "query_processing"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
