services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    container_name: nl2anyquery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nl2anyquery_db
      POSTGRES_USER: nl2user
      POSTGRES_PASSWORD: nl2password
    ports:
      # If your local PostgreSQL is using port 5432, you can change the host port to 5433:5432
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nl2user -d nl2anyquery_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: nl2anyquery_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 45s
      timeout: 5s
      retries: 10

  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: nl2anyquery_seed
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://nl2user:nl2password@postgres:5432/nl2anyquery_db
      FINOPS_DSN: ${FINOPS_DSN:-postgresql://nl2user:nl2password@postgres:5432/finopsiq_be}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: nl2anyquery_demo
      MONGO_SAMPLE_LIMIT: ${MONGO_SAMPLE_LIMIT:-10}
    volumes:
      - ./backend/src/data/schemas:/app/backend/src/data/schemas
    entrypoint: ["sh", "docker/seed.sh"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: nl2anyquery_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      POSTGRES_DSN: postgresql://nl2user:nl2password@postgres:5432/nl2anyquery_db
      FINOPS_DSN: ${FINOPS_DSN:-postgresql://nl2user:nl2password@postgres:5432/finopsiq_be}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: nl2anyquery_demo
      KOBOLDCPP_BASE_URL: ${KOBOLDCPP_BASE_URL:-http://host.docker.internal:5001/v1}
      KOBOLDCPP_MODEL: ${KOBOLDCPP_MODEL:-qwen3-4b-instruct-2507}
      KOBOLDCPP_EMBEDDING_MODEL: ${KOBOLDCPP_EMBEDDING_MODEL:-all-MiniLM-L6-v2-Q8_0}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-10}
      SIMILARITY_TOP_K: ${SIMILARITY_TOP_K:-10}
      MAX_CANDIDATE_TABLES: ${MAX_CANDIDATE_TABLES:-10}
      MODEL_TEMPERATURE: ${MODEL_TEMPERATURE:-0.1}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-1500}
      TABLE_SELECTOR_MAX_TOKENS: ${TABLE_SELECTOR_MAX_TOKENS:-8000}
      VALIDATOR_MAX_TOKENS: ${VALIDATOR_MAX_TOKENS:-8000}
      GUARDRAIL_MAX_TOKENS: ${GUARDRAIL_MAX_TOKENS:-1200}
      QUERY_TIMEOUT_SECONDS: ${QUERY_TIMEOUT_SECONDS:-10}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-0}
      MAX_RESULT_ROWS: ${MAX_RESULT_ROWS:-1000}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.25}
      HF_API_KEY: ${HF_API_KEY:-}
      HF_MODEL: ${HF_MODEL:-}
      HF_BASE_URL: ${HF_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind-mounted, not a named volume: ingestion rewrites the schema, graph,
      # MST and description TOMLs, and those belong on the host where they can be
      # read and committed. In a named volume they were written inside the
      # container only, so the files in the repository never changed and looked
      # permanently empty.
      - ./backend/src/data/schemas:/app/backend/src/data/schemas
      # Bind-mounted (not a named volume) so embeddings regenerated by
      # POST /ingest land on the host and can be committed, and so they survive
      # container recreation instead of reverting to the image-baked copy.
      #
      # The whole directory, not one mount per file: these JSON files are
      # gitignored, so on a fresh checkout they do not exist, and Docker creates
      # a DIRECTORY in place of any bind-mounted file that is missing on the
      # host. Reads then fail with IsADirectoryError. Mounting the directory
      # makes new targets work with no compose change, too.
      - ./backend/src/data/embeddings:/app/backend/src/data/embeddings
    ports:
      - "8000:8000"
    command: ["uvicorn", "backend.src.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: nl2anyquery_frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "frontend/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
