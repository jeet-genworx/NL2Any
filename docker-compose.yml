services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    container_name: nl2anyquery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nl2anyquery_db
      POSTGRES_USER: nl2user
      POSTGRES_PASSWORD: nl2password
    ports:
      # If your local PostgreSQL is using port 5432, you can change the host port to 5433:5432
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
